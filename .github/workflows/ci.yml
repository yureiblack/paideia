name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: paideia
          POSTGRES_PASSWORD: paideia
          POSTGRES_DB: paideia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paideia -d paideia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://paideia:paideia@localhost:5432/paideia
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt
      # The embedding model the real-model tests load, about 64 MB, kept
      # between runs instead of downloaded every time. app/config.py names
      # the model, so any change there fetches it afresh.
      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: data/models
          key: embedding-model-${{ hashFiles('api/app/config.py') }}
      - run: ruff check .
      - run: ruff format --check .
      # The same command a deployment runs, through the app's own settings.
      - name: Apply migrations
        run: alembic upgrade head
      # Fails if a model changed without a migration to match it.
      - name: Check models match migrations
        run: alembic check
      - run: pytest

  web:
    name: Web (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
