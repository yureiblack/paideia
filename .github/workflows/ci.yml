name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels the run it replaces. On main every
# merge keeps its own run, so each commit there has a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# What each job checks, and what none of them do, is in
# docs/architecture/22-testing-and-ci.md. A test that fails is never retried.
jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: paideia
          POSTGRES_PASSWORD: paideia
          POSTGRES_DB: paideia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paideia -d paideia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # The worker's tests talk to Redis, as the worker does.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://paideia:paideia@localhost:5432/paideia
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt
      # The embedding and reranking models the real-model tests load, kept
      # between runs instead of downloaded every time. app/config.py names
      # the models, so any change there fetches them afresh.
      - name: Cache the models
        uses: actions/cache@v6
        with:
          path: data/models
          key: embedding-model-${{ hashFiles('api/app/config.py') }}
      - run: ruff check .
      - run: ruff format --check .
      - name: Check types
        run: mypy
      # The same command a deployment runs, through the app's own settings.
      - name: Apply migrations
        run: alembic upgrade head
      # Fails if a model changed without a migration to match it.
      - name: Check models match migrations
        run: alembic check
      - name: Tests, with coverage
        run: pytest --cov --cov-report=term --cov-report=html
      # Reported, never enforced: no percentage fails the build.
      - name: Coverage summary
        run: |
          echo "## Backend coverage" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: api/htmlcov
          retention-days: 14

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Tests, with coverage
        run: pnpm test:coverage
      - name: Coverage summary
        run: |
          node -e '
            const total = require("./coverage/coverage-summary.json").total;
            const rows = ["lines", "statements", "branches", "functions"]
              .map((k) => `| ${k} | ${total[k].pct}% | ${total[k].covered} of ${total[k].total} |`);
            console.log(["## Web coverage", "", "| | Covered | |", "|---|---|---|", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the coverage report
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: web/coverage
          retention-days: 14
      - run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: paideia
          POSTGRES_PASSWORD: paideia
          POSTGRES_DB: paideia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paideia -d paideia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The backend's packages are installed without a virtual environment.
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - name: Cache the models
        uses: actions/cache@v6
        with:
          path: data/models
          key: embedding-model-${{ hashFiles('api/app/config.py') }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      # Starts the API, the worker and the page itself (web/playwright.config.ts).
      - name: The learner's journey
        run: pnpm e2e
        working-directory: web
      - name: Keep the report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
